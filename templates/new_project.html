<!DOCTYPE html>
<html lang="en">
<head>
    <title>Post Project - AITU Collab</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        :root { --bg: #0f0f13; --card-bg: #1c1c24; --text-main: #f1f2f6; --text-muted: #a4b0be; --accent: #6c5ce7; --accent-hover: #5b4bc4; --border: #333344; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: var(--bg); color: var(--text-main); padding: 20px; box-sizing: border-box; }
        
        .form-container { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        h2 { text-align: center; margin-top: 0; margin-bottom: 25px; }
        
        label { font-weight: bold; color: var(--text-muted); font-size: 0.9em; margin-bottom: 8px; display: block; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,0.03); color: var(--text-main); box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.06); }
        
        button { width: 100%; padding: 14px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: var(--accent-hover); }
        
        .back-link { display: block; text-align: center; margin-top: 25px; text-decoration: none; color: var(--text-muted); transition: 0.2s; font-weight: bold; }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🚀 Create New Project</h2>
        
        <form method="POST" action="{{ url_for('new_project') }}">
            <label>Project Title</label>
            <input type="text" name="title" placeholder="e.g., Mobile App for AITU Collab" required>
            
            <label>Course / Event Name</label>
            <input type="text" name="course_name" placeholder="e.g., Python Fundamentals" required>
            
            <label>Detailed Description</label>
            <textarea name="description" rows="4" placeholder="Describe your project in detail..." required></textarea>
            
            <label>Required Skills</label>
            <input type="text" name="required_skills" placeholder="e.g., Python, Flask, UI/UX" required>
            
            <label>How many partners needed?</label>
            <input type="number" name="partners_needed" min="1" max="10" value="1" required>
            
            <button type="submit">Post Project</button>
        </form>
        <a href="{{ url_for('dashboard') }}" class="back-link">← Cancel and return to Feed</a>
    </div>
</body>
</html>
