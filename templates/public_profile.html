<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ target_user.username }}'s Profile</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        :root { --bg: #0f0f13; --card-bg: #1c1c24; --text-main: #f1f2f6; --text-muted: #a4b0be; --accent: #6c5ce7; --border: #333344; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .profile-card { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 100%; max-width: 500px; text-align: center; }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; }
        .rating-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border); }
        .btn { padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .star-radio { display: none; }
        .star-label { font-size: 2em; color: var(--border); cursor: pointer; }
        .star-radio:checked ~ .star-label { color: #f1c40f; } /* Yellow stars */
    </style>
</head>
<body>
    <div class="profile-card">
        <a href="{{ url_for('dashboard') }}" style="color: var(--text-muted); text-decoration: none; display: block; text-align: left; margin-bottom: 20px;">← Back</a>
        
        <img src="{{ url_for('static', filename='uploads/' + (target_user.profile_pic or 'default.png')) }}" class="profile-pic">
        <h1 style="margin: 10px 0 5px 0;">{{ target_user.username }}</h1>
        <p style="color: var(--text-muted); margin: 0;">{{ target_user.major }} | {{ target_user.course_year }}</p>
        
        <div class="rating-box">
            <h2 style="margin: 0; color: #f1c40f;">★ {{ avg_rating }}</h2>
            <p style="font-size: 0.8em; color: var(--text-muted); margin-top: 5px;">Based on {{ reviews|length }} reviews</p>
        </div>
        
        {% if target_user.id != current_user.id %}
            <h3 style="border-top: 1px solid var(--border); padding-top: 20px;">Leave a Review</h3>
            <form method="POST">
                <div style="direction: rtl; display: inline-block; margin-bottom: 15px;">
                    <input type="radio" id="star5" name="stars" value="5" class="star-radio" required><label for="star5" class="star-label">★</label>
                    <input type="radio" id="star4" name="stars" value="4" class="star-radio"><label for="star4" class="star-label">★</label>
                    <input type="radio" id="star3" name="stars" value="3" class="star-radio"><label for="star3" class="star-label">★</label>
                    <input type="radio" id="star2" name="stars" value="2" class="star-radio"><label for="star2" class="star-label">★</label>
                    <input type="radio" id="star1" name="stars" value="1" class="star-radio"><label for="star1" class="star-label">★</label>
                </div><br>
                <button type="submit" class="btn">Submit Review</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
